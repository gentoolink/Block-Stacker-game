<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #2a2a2a;
            overflow: hidden;
        }

        .block {
            position: absolute;
            background: #4CAF50;
            transition: transform 0.1s ease-out;
        }

        .score-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 1000;
        }

        .game-over h2 {
            margin-bottom: 20px;
            color: #ff4444;
        }

        .restart-btn {
            background: #4CAF50;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .restart-btn:hover {
            background: #45a049;
        }

        .perfect-stack {
            animation: perfectStack 0.5s ease-out;
        }

        @keyframes perfectStack {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .particle {
            position: absolute;
            background: #4CAF50;
            pointer-events: none;
            animation: particleFade 0.5s ease-out forwards;
        }

        @keyframes particleFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="score-container">
        Score: <span id="score">0</span><br>
        Best: <span id="best-score">0</span>
    </div>

    <div id="game-container"></div>

    <div class="game-over">
        <h2>Game Over!</h2>
        <p>Your score: <span id="final-score">0</span></p>
        <button class="restart-btn" onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // Game constants
        const BLOCK_HEIGHT = 40;
        const INITIAL_BLOCK_WIDTH = 100;
        const MIN_BLOCK_WIDTH = 20;
        const GAME_SPEED = 5;
        const PERFECT_STACK_BONUS = 10;

        // Game state
        let currentBlock = null;
        let previousBlock = null;
        let score = 0;
        let bestScore = localStorage.getItem('bestScore') || 0;
        let gameActive = true;
        let direction = 1;
        let perfectStackCount = 0;

        // DOM elements
        const gameContainer = document.getElementById('game-container');
        const scoreElement = document.getElementById('score');
        const bestScoreElement = document.getElementById('best-score');
        const gameOverElement = document.querySelector('.game-over');
        const finalScoreElement = document.getElementById('final-score');

        // Initialize game
        function initGame() {
            gameContainer.innerHTML = '';
            score = 0;
            scoreElement.textContent = score;
            bestScoreElement.textContent = bestScore;
            gameActive = true;
            direction = 1;
            perfectStackCount = 0;
            
            // Create first block
            createBlock();
        }

        // Create a new block
        function createBlock() {
            const block = document.createElement('div');
            block.className = 'block';
            
            // Set initial position
            const containerWidth = gameContainer.offsetWidth;
            const blockWidth = previousBlock ? previousBlock.offsetWidth : INITIAL_BLOCK_WIDTH;
            
            block.style.width = `${blockWidth}px`;
            block.style.height = `${BLOCK_HEIGHT}px`;
            block.style.left = '0px';
            block.style.bottom = previousBlock ? 
                `${parseInt(previousBlock.style.bottom) + BLOCK_HEIGHT}px` : '0px';
            
            gameContainer.appendChild(block);
            currentBlock = block;
        }

        // Move block horizontally
        function moveBlock() {
            if (!gameActive) return;

            const containerWidth = gameContainer.offsetWidth;
            const blockWidth = currentBlock.offsetWidth;
            let currentLeft = parseInt(currentBlock.style.left);

            currentLeft += GAME_SPEED * direction;

            // Reverse direction at edges
            if (currentLeft + blockWidth > containerWidth) {
                direction = -1;
                currentLeft = containerWidth - blockWidth;
            } else if (currentLeft < 0) {
                direction = 1;
                currentLeft = 0;
            }

            currentBlock.style.left = `${currentLeft}px`;
            requestAnimationFrame(moveBlock);
        }

        // Handle block placement
        function placeBlock() {
            if (!gameActive) return;

            const containerWidth = gameContainer.offsetWidth;
            const currentLeft = parseInt(currentBlock.style.left);
            const previousLeft = previousBlock ? parseInt(previousBlock.style.left) : 0;
            
            // Calculate overlap
            const overlap = Math.min(
                currentLeft + currentBlock.offsetWidth,
                previousLeft + (previousBlock ? previousBlock.offsetWidth : containerWidth)
            ) - Math.max(currentLeft, previousLeft);

            // Check if block is too small
            if (overlap < MIN_BLOCK_WIDTH) {
                endGame();
                return;
            }

            // Update score
            score++;
            if (overlap === (previousBlock ? previousBlock.offsetWidth : containerWidth)) {
                score += PERFECT_STACK_BONUS;
                currentBlock.classList.add('perfect-stack');
                createParticles(currentBlock);
            }
            
            scoreElement.textContent = score;

            // Slice the block
            currentBlock.style.width = `${overlap}px`;
            currentBlock.style.left = `${Math.max(currentLeft, previousLeft)}px`;

            // Create particles for the cut-off part
            createSliceParticles(currentLeft, currentBlock.offsetWidth, overlap);

            previousBlock = currentBlock;
            createBlock();
        }

        // Create particles for perfect stack
        function createParticles(block) {
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = '5px';
                particle.style.height = '5px';
                particle.style.left = `${parseInt(block.style.left) + Math.random() * block.offsetWidth}px`;
                particle.style.bottom = `${parseInt(block.style.bottom) + Math.random() * block.offsetHeight}px`;
                gameContainer.appendChild(particle);
                
                setTimeout(() => particle.remove(), 500);
            }
        }

        // Create particles for sliced parts
        function createSliceParticles(left, width, overlap) {
            const sliceWidth = width - overlap;
            if (sliceWidth <= 0) return;

            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = `${sliceWidth / 5}px`;
                particle.style.height = `${BLOCK_HEIGHT}px`;
                particle.style.left = `${left + overlap + (sliceWidth / 5) * i}px`;
                particle.style.bottom = currentBlock.style.bottom;
                gameContainer.appendChild(particle);
                
                setTimeout(() => particle.remove(), 500);
            }
        }

        // End game
        function endGame() {
            gameActive = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('bestScore', bestScore);
                bestScoreElement.textContent = bestScore;
            }
            finalScoreElement.textContent = score;
            gameOverElement.style.display = 'block';
        }

        // Restart game
        function restartGame() {
            gameOverElement.style.display = 'none';
            gameContainer.innerHTML = ''; // Clear all blocks
            currentBlock = null;
            previousBlock = null;
            score = 0;
            scoreElement.textContent = score;
            gameActive = true;
            direction = 1;
            perfectStackCount = 0;
            
            // Create first block and start movement
            createBlock();
            requestAnimationFrame(moveBlock);
        }

        // Event listeners
        document.addEventListener('click', placeBlock);
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            placeBlock();
        });

        // Start game
        initGame();
        moveBlock();
    </script>
</body>
</html>
